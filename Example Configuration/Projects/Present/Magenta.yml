parameters: {}

variables: {
  ProjectDescription: 'Custom Magenta Project. Contact Name: John Doe.',
  ProjectRepositoryName: 'CON_Configuration',
  Project_Service_GitRepositories: 'enabled',
  Project_Service_BuildPipelines: 'enabled',
  Project_Service_AzureArtifact: 'enabled'
}

resources:

- name: Configuration Git Repository
  type: AzureDevOpsDscNative/AzDoGitRepository
  dependsOn: 
    - AzureDevOpsDscNative/AzDoProject/Project
  properties:
    ProjectName: $(variables('ProjectName'))
    RepositoryName: $(variables('ProjectRepositoryName'))

- name: Configuration Git Permissions
  type: AzureDevOpsDscNative/AzDoGitPermission
  dependsOn:
    - AzureDevOpsDscNative/AzDoGitRepository/Configuration Git Repository
    - AzureDevOpsDscNative/AzDoProjectGroup/CON Readers
    - AzureDevOpsDscNative/AzDoProjectGroup/CON Board Administrators
  properties:
    ProjectName: $(variables('ProjectName'))
    RepositoryName: $(variables('ProjectRepositoryName'))
    isInherited: false
    Permissions:
      - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONReaders'))"
        Permission:
          Read: "Allow"
      - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONContributors'))"
        Permission:
          Read: "Allow"
          Contribute: "Allow"
          CreateBranch: "Allow"
          PullRequestContribute: "Allow"
      - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONReleaseAdministrators'))"
        Permission:
          Read: "Allow"
          CreateTag: "Allow"
          ManageNote: "Allow"
          EditPolicies: "Allow"
          PullRequestContribute: "Allow"
      - Identity: "[$(variables('ProjectName'))]\\$(variables('ProjectGroups_Role_CONBuildAdministrators'))"
        Permission:
          Read: "Allow"
          Contribute: "Allow"
          CreateTag: "Allow"
          ManageNote: "Allow"
          PullRequestContribute: "Allow"
          EditPolicies: "Allow"
      - Identity: "[$(variables('Organization_Name'))]\\$(variables('Organization_Role_ProjectCollectionAdmins'))"
        Permission:
          Read: "Allow"
          Contribute: "Allow"
          CreateBranch: "Allow"
          CreateTag: "Allow"
          ManageNote: "Allow"
          EditPolicies: "Allow"
          RemoveOthersLocks: "Allow"
          ManagePermissions: "Allow"

