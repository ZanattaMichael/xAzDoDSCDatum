
parameters: {}

variables: {
  "ProjectGroups_Role_CONBoardAdministrators": "CON Board Administrators",
  "ProjectGroups_Role_CONReaders": "CON Readers",
  "ProjectGroups_Role_CONContributors": "Contributors",
  "ProjectGroups_Role_CONBuildAdministrators": "Build Administrators",
  "ProjectGroups_Role_CONReleaseAdministrators": "CON Release Administrators",
}

resources:

  - name: CON Readers
    type: AzureDevOpsDscNative/AzDoProjectGroup
    dependsOn: 
      - AzureDevOpsDscNative/AzDoProject/Project
    properties:
      ProjectName: $(variables('ProjectName'))
      GroupName: $(variables('ProjectGroups_Role_CONReaders'))
      GroupDescription: The following group provides members with read access to the project and codebase.

  - name: CON Board Administrators
    # preCondition (issue #57 §2): the current key name; the bare 'condition' key above this
    # comment used to be used here and still works as a deprecated alias (Start-DscRunner emits
    # a one-line warning). Demonstrates the function-language accessors permitted inside a
    # preCondition (an explicit allow-list, enforced by Assert-SafeConditionExpression):
    # variables() reads a Datum-resolved variable (never throws - a missing key returns $null,
    # unlike parameters()), and equals()/not() compose a pure, side-effect-free predicate. Note
    # the argument style: PowerShell command syntax takes space-separated arguments, not
    # comma-separated ones in parentheses - `equals (variables 'X') 'Y'`, not `equals(X, Y)`
    # (the latter parses as a single two-element array argument and throws a parameter-binding
    # error at evaluation time). Magenta never sets Project_Service_WorkBoards, so this stays
    # $false for it (the group is skipped), exactly like the pre-rename 'condition' behaved -
    # see docs/lifecycle-scripting-and-reboot-handling.md.
    preCondition: equals (variables 'Project_Service_WorkBoards') 'enabled'
    type: AzureDevOpsDscNative/AzDoProjectGroup
    dependsOn: 
      - AzureDevOpsDscNative/AzDoProject/Project
    properties:
      ProjectName: $(variables('ProjectName'))
      GroupName: $(variables('ProjectGroups_Role_CONBoardAdministrators'))
      GroupDescription: The following group provides members with administrative access to the project boards.

